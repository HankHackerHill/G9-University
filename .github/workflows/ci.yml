name: ci

# Manual only, by the owner's decision (2026-11-13): no push, pull_request or schedule trigger.
# Start a run from the Actions tab ("Run workflow"); GitHub shows that button only for workflows
# on the default branch. Before pushing, run the same checks locally: scripts/ci_preflight.sh.
on:
  workflow_dispatch:

permissions:
  contents: read

# Cost: standard GitHub-hosted runners are free for a PUBLIC repository. If this repository is
# made private, every run draws on the plan's included Actions allowance (measured here: 9 to 14
# billed minutes per run with jobs rounded up to whole minutes, runs 27 and 28). The two guards
# below bound that: a newer run of the same ref cancels the superseded one, and every job has
# a time limit (the default is 360 minutes, which one hung job would consume in full).
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

# Runner image: ubuntu-26.04 (x64), generally available since 2026-09-17 (public preview from
# 2026-06-11). Keep the explicit label; do not use ubuntu-latest. Record the runner ImageVersion
# in each stage report. Target host: Ubuntu 26.04.1 LTS (released 2026-08-27, VERIFIED on
# discourse.ubuntu.com). Actions are pinned by commit SHA to Node-24 releases (SEC-18, PLT-16).

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: "-D warnings"

jobs:
  rust:
    name: rust (fmt, clippy, test, deny)
    runs-on: ubuntu-26.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # v1
        with:
          toolchain: 1.97.0
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@2201cc584a476d1b508be977bbe4b7d1c7a52e9c # v2.9.3
      - name: fmt
        run: cargo fmt --all --check
      - name: clippy (default members; Tauri shell needs system libs)
        run: cargo clippy --locked --all-targets -- -D warnings
      - name: test
        run: cargo test --locked --all-targets
      - name: doc tests
        run: cargo test --locked --doc
      - name: layering gate over the deny.toml target graph (shell included)
        run: cargo test --locked -p g9-evaluation --test layering_gate -- --ignored
      - name: dependency tree (line count; a cycle already fails the build)
        run: cargo tree --locked -e normal --prefix none | sort -u > /tmp/tree.txt && wc -l /tmp/tree.txt
      - name: cargo-deny (licenses, advisories, bans)
        uses: EmbarkStudios/cargo-deny-action@c3bbe7e4e3f7baeee1a3dd9aec0a3b2aded580fb # v2.1.1
        with:
          command: check
          arguments: --all-features --locked

  desktop-shell:
    name: tauri shell (Linux build with system webkit)
    runs-on: ubuntu-26.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # v1
        with:
          toolchain: 1.97.0
      - uses: Swatinem/rust-cache@2201cc584a476d1b508be977bbe4b7d1c7a52e9c # v2.9.3
      - name: install tauri linux prerequisites
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev build-essential curl wget file libxdo-dev libssl-dev libayatana-appindicator3-dev librsvg2-dev
      - name: build shell (check only)
        run: cargo check --locked -p g9-mentor-desktop
      # The shell's own tests include the only automated comparison of
      # skill-pins.json with the bundled packages, and the bridge tests;
      # `cargo test` in the rust job covers default members only.
      - name: shell tests (bridge, skill pins)
        run: cargo test --locked -p g9-mentor-desktop --lib

  frontend:
    name: frontend (typecheck, lint, test, build)
    runs-on: ubuntu-26.04
    timeout-minutes: 15
    defaults:
      run:
        working-directory: apps/desktop
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: apps/desktop/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm test -- --run
      - run: npm run build
      - name: npm audit (high+)
        run: npm audit --audit-level=high

  content-gates:
    name: curriculum + skills + schema gates
    runs-on: ubuntu-26.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # A virtual environment, not `pip install --user`: the gates run as `python3 -I`, and
      # -I ignores the user site directory, so a --user install is invisible to them.
      - name: python validator dependency (jsonschema, Draft 2020-12)
        run: |
          python3 -m venv "$RUNNER_TEMP/gates"
          "$RUNNER_TEMP/gates/bin/python" -m pip install "jsonschema==4.26.0"
          echo "PY=$RUNNER_TEMP/gates/bin/python" >> "$GITHUB_ENV"
      - name: curriculum seed invariants (A01 static)
        run: $PY -I scripts/check_curriculum_seed.py data/curriculum/g9-ct9-480.seed.v0.json
      - name: skill package contract
        run: $PY -I scripts/check_skill_packages.py .agents/skills
      - name: skill package hashes (pins and registry agree with package_sha256)
        run: $PY -I scripts/skill_hashes.py --check
      - name: reference source register (schema, honesty invariants, rendered table)
        run: $PY -I scripts/check_source_register.py
      - name: source register verifier helpers (offline self-test; performs no requests)
        run: $PY -I scripts/verify_source_register.py --selftest
      - name: json schemas are valid 2020-12
        run: $PY -I scripts/check_schemas.py schemas .agents/skills
      - name: curriculum build (generated files are current)
        run: $PY -I scripts/build_curriculum.py
      # v2.0 courseware (ADR-0023): --available checks every week written so far; once all 12 exist it also requires the generated files to be current
      - name: curriculum v2.0 build (weeks written so far; generated files current once all 12 exist)
        run: $PY -I scripts/build_curriculum_v2.py --available
      - name: competency packs
        run: $PY -I scripts/check_competency_packs.py data/competency-packs
      - name: data inventory (every table has a row in docs/data-model.md)
        run: $PY -I scripts/check_data_inventory.py
      - name: error-code catalogue (docs/runbooks/error-codes.md is current; no dead code reference)
        run: $PY -I scripts/gen_error_codes.py
      - name: document references (every repository path a document names exists)
        run: $PY -I scripts/check_doc_refs.py
      - name: metrics (docs/release/metrics.md is current)
        run: $PY -I scripts/gen_metrics.py
      - name: backlog map (every open register and RTM row is mapped or counted; the unmapped count only goes down)
        run: $PY -I scripts/check_backlog.py
      - name: no ignored project file (nothing .gitignore excludes is part of the project; GIT-1)
        run: $PY -I scripts/check_ignored_files.py
      - name: tests of the gates themselves
        run: G9_REQUIRE_JSONSCHEMA=1 $PY -I -m unittest discover -s scripts/tests -p 'test_*.py'

  sbom:
    name: SBOM (CycloneDX, Rust + npm)
    runs-on: ubuntu-26.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # v1
        with:
          toolchain: 1.97.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22"
      - name: Rust SBOM (cargo-cyclonedx, linux target)
        run: |
          cargo install cargo-cyclonedx --version 0.5.10 --locked
          cargo cyclonedx --format json --target x86_64-unknown-linux-gnu --all-features
          mkdir -p sbom && find . -name '*.cdx.json' -not -path './target/*' -exec cp --parents {} sbom/ \;
      - name: npm SBOM (production dependencies; @tauri-apps/api is a runtime dependency)
        working-directory: apps/desktop
        run: |
          npm ci
          npx --yes @cyclonedx/cyclonedx-npm@6.0.1 --omit dev --output-file ../../sbom/desktop-npm.cdx.json
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: sbom
          path: sbom/

