name: ci

on:
  push:
    branches: ["main", "ccr-*"]
  pull_request:

permissions:
  contents: read

# Runner image: ubuntu-26.04 (x64), generally available since 2026-09-17 (public preview from
# 2026-06-11). Keep the explicit label; do not use ubuntu-latest. Record the runner ImageVersion
# in each stage report. Target host: Ubuntu 26.04.1 LTS (released 2026-08-27, VERIFIED on
# discourse.ubuntu.com). Actions are pinned by commit SHA to Node-24 releases (SEC-18, PLT-16).

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: "-D warnings"

jobs:
  rust:
    name: rust (fmt, clippy, test, deny)
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # v1
        with:
          toolchain: 1.97.0
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@2201cc584a476d1b508be977bbe4b7d1c7a52e9c # v2.9.3
      - name: fmt
        run: cargo fmt --all --check
      - name: clippy (default members; Tauri shell needs system libs)
        run: cargo clippy --all-targets -- -D warnings
      - name: test
        run: cargo test --all-targets
      - name: doc tests
        run: cargo test --doc
      - name: dependency graph has no cycles / tree
        run: cargo tree -e normal --prefix none | sort -u > /tmp/tree.txt && wc -l /tmp/tree.txt
      - name: cargo-deny (licenses, advisories, bans)
        uses: EmbarkStudios/cargo-deny-action@c3bbe7e4e3f7baeee1a3dd9aec0a3b2aded580fb # v2.1.1
        with:
          command: check
          arguments: --all-features

  desktop-shell:
    name: tauri shell (Linux build with system webkit)
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # v1
        with:
          toolchain: 1.97.0
      - uses: Swatinem/rust-cache@2201cc584a476d1b508be977bbe4b7d1c7a52e9c # v2.9.3
      - name: install tauri linux prerequisites
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev build-essential curl wget file libxdo-dev libssl-dev libayatana-appindicator3-dev librsvg2-dev
      - name: build shell (check only)
        run: cargo check -p g9-mentor-desktop

  frontend:
    name: frontend (typecheck, lint, test, build)
    runs-on: ubuntu-26.04
    defaults:
      run:
        working-directory: apps/desktop
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: apps/desktop/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm test -- --run
      - run: npm run build
      - name: npm audit (high+)
        run: npm audit --audit-level=high

  content-gates:
    name: curriculum + skills + schema gates
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: python validator dependency (jsonschema, Draft 2020-12)
        run: python3 -m pip install --user "jsonschema==4.26.0"
      - name: curriculum seed invariants (A01 static)
        run: python3 -I scripts/check_curriculum_seed.py data/curriculum/g9-ct9-480.seed.v0.json
      - name: skill package contract
        run: python3 -I scripts/check_skill_packages.py .agents/skills
      - name: json schemas are valid 2020-12
        run: python3 -I scripts/check_schemas.py schemas .agents/skills

  sbom:
    name: SBOM (CycloneDX, Rust + npm)
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # v1
        with:
          toolchain: 1.97.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22"
      - name: Rust SBOM (cargo-cyclonedx, linux target)
        run: |
          cargo install cargo-cyclonedx --locked
          cargo cyclonedx --format json --target x86_64-unknown-linux-gnu --all-features
          mkdir -p sbom && find . -name '*.cdx.json' -not -path './target/*' -exec cp --parents {} sbom/ \;
      - name: npm SBOM (production dependencies; @tauri-apps/api is a runtime dependency)
        working-directory: apps/desktop
        run: |
          npm ci
          npx --yes @cyclonedx/cyclonedx-npm --omit dev --output-file ../../sbom/desktop-npm.cdx.json
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: sbom
          path: sbom/

