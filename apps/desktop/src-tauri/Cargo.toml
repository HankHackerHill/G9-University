[package]
name = "g9-mentor-desktop"
description = "Minimal Tauri 2 bridge for G9 MENTOR. Exposes only typed g9-app commands; no unrestricted native APIs. Requires webkit2gtk-4.1 + GTK3 on Linux."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[lib]
name = "g9_mentor_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.7.4", features = [] }

[dependencies]
tauri = { version = "2.12.5", features = [] }
serde = { workspace = true }
serde_json = { workspace = true }
g9-domain = { workspace = true }
g9-app = { workspace = true }
# Bootstrap composition only (no SQL, no policy decisions here): `Database::open`,
# `BindingKey`, `Registry::load_pinned` (pins: `skill-pins.json`, compiled in with
# `include_str!`) are the types `g9_app::AppContext::builder` takes.
g9-policy = { workspace = true }
g9-storage = { workspace = true }
g9-skills = { workspace = true }
# Approval binding key (src/keyring.rs): 32 bytes from the OS CSPRNG into a 0600
# file. Exact pin; already in the lock file through uuid. No OS keyring crate:
# every Secret Service client fails the A12 advisory or licence gate
# (apps/desktop/README.md "Binding key").
getrandom = "=0.4.3"

[dev-dependencies]
tempfile = { workspace = true }

[lints]
workspace = true
