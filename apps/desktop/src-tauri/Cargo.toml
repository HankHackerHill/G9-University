[package]
name = "g9-mentor-desktop"
description = "Minimal Tauri 2 bridge for G9 MENTOR. Exposes only typed g9-app commands; no unrestricted native APIs. Requires webkit2gtk-4.1 + GTK3 on Linux."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[lib]
name = "g9_mentor_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.7.4", features = [] }

[dependencies]
tauri = { version = "2.12.5", features = [] }
serde = { workspace = true }
serde_json = { workspace = true }
g9-domain = { workspace = true }
g9-app = { workspace = true }

[lints]
workspace = true
