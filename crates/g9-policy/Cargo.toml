[package]
name = "g9-policy"
description = "Independent deny-by-default authorization engine (M16): actor/action/resource/capability rules, approval binding, decision logging."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[dependencies]
g9-domain = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }
sha2 = { workspace = true }
hex = { workspace = true }
hmac = { workspace = true }
subtle = { workspace = true }
# Wipes the binding key (and the digest subkey derived from it) when it is dropped (core-11).
# Not a workspace dependency: only this crate holds key material. Apache-2.0 OR MIT.
zeroize = { version = "=1.9.1", default-features = false }

[dev-dependencies]
pretty_assertions = { workspace = true }

[lints]
workspace = true
