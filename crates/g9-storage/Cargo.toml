[package]
name = "g9-storage"
description = "SQLite persistence (M17 + repositories): schema migrations with checksums, foreign keys, WAL profile, Online Backup API / VACUUM INTO snapshots, integrity verification, hash-chained audit metadata."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[dependencies]
g9-domain = { workspace = true }
g9-curriculum = { workspace = true }
g9-calendar = { workspace = true }
g9-evidence = { workspace = true }
g9-competency = { workspace = true }
g9-assessment = { workspace = true }
g9-retention = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }
rusqlite = { workspace = true }
chrono = { workspace = true }
sha2 = { workspace = true }
hex = { workspace = true }
tracing = { workspace = true }

# Free space on the backup directory's filesystem before a snapshot starts
# (STOR-4, `backup::FreeSpaceSource`): a safe `statvfs` wrapper, since
# `unsafe_code` is forbidden. Exact pin of the version already in Cargo.lock
# (through tempfile); `fs` is the only API used. Other platforms skip the check.
[target.'cfg(unix)'.dependencies]
rustix = { version = "=1.1.6", features = ["fs"] }

[dev-dependencies]
pretty_assertions = { workspace = true }
tempfile = { workspace = true }

[lints]
workspace = true
