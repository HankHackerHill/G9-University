[package]
name = "g9-app"
description = "Application services and typed IPC command handlers composing policy, storage and domain crates (M01 bridge)."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[dependencies]
g9-domain = { workspace = true }
g9-policy = { workspace = true }
g9-storage = { workspace = true }
g9-curriculum = { workspace = true }
g9-calendar = { workspace = true }
g9-evidence = { workspace = true }
g9-competency = { workspace = true }
g9-assessment = { workspace = true }
g9-retention = { workspace = true }
g9-ai-adapter = { workspace = true }
g9-skills = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }
tracing = { workspace = true }
# Payload validation against schemas/ipc (§5 step 1); file/http resolution disabled.
jsonschema = { workspace = true }
# Only to name the transaction/connection types g9-storage hands out; no SQL is written here.
rusqlite = { workspace = true }
# Approval binding key file store (src/keyfile.rs, moved here from the Tauri
# bridge so the CLI and the bridge share one implementation): 32 bytes from the
# OS CSPRNG into a 0600 file. Exact pin; already in the lock file.
getrandom = "=0.4.3"

[dev-dependencies]
pretty_assertions = { workspace = true }
tempfile = { workspace = true }

[lints]
workspace = true
